<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5F59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DuitTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>DuitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#0F5F59;--bg:#F3F6F5;--card:#fff;--ink:#10201E;--mut:#5B6B68;--ln:#E3E8E6;--soft:#E6F0EF;--seg:#E6ECEA;--inc:#0B7A4B;--exp:#B4401A}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#DDE4E2;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
button,input,select{font-family:inherit;color:inherit}
#app{max-width:420px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
#view{flex:1;overflow-y:auto;padding:20px 16px 110px}
#view.ob{padding-bottom:24px}
#view.tb{padding-bottom:150px}
.wzdots{display:flex;gap:6px;justify-content:center;margin:-4px 0 14px}.wzdots i{width:8px;height:8px;border-radius:4px;background:var(--ln);transition:width .2s}.wzdots i.on{background:var(--a);width:22px}
.wzq{font-size:20px;font-weight:800;letter-spacing:-.01em}
.wznav{display:flex;gap:10px;margin-top:18px}.wznav .btn{flex:1}
.chipsel{border:0;background:none;height:auto;padding:0;font-size:13px;font-weight:600;width:auto;color:var(--ink)}
.hbtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.mm input{margin-top:12px}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{border:0;border-radius:20px;background:color-mix(in srgb,var(--tc) 12%,var(--card));color:var(--ink);text-align:left;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:132px}
.ptile .pe{width:48px;height:48px;border-radius:15px;background:var(--tc);display:flex;align-items:center;justify-content:center;font-size:24px}
.ptile b{font-size:16px}.ptile small{font-size:12px;color:var(--mut);font-weight:600}
#tripbar{position:absolute;left:0;right:0;bottom:76px;background:var(--card);border-top:1px solid var(--ln);padding:8px 16px 10px;z-index:5;cursor:pointer}
.fablbl{font-size:10px;font-weight:700;color:var(--a);margin-top:2px}
nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 8px 0;z-index:5}
.nb{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;padding:6px 0}
.nb.on{color:var(--a)}
.fab{width:56px;height:56px;border-radius:28px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.h2{font-size:15px;font-weight:700;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.t{font-size:14px;font-weight:600}
.mut{color:var(--mut);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.pad{padding:16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid var(--ln)}
.list-btn{width:100%;border:0;background:var(--card);text-align:left;cursor:pointer}
.hero{background:var(--a);color:#fff;border-radius:20px;padding:20px}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar>i{display:block;height:100%;background:var(--a);border-radius:4px}
.bar.over>i{background:var(--exp)}
.hero .bar{background:rgba(255,255,255,.2)}.hero .bar>i{background:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.grid3 .card{padding:12px}
.btn{height:48px;border:0;border-radius:14px;background:var(--a);color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:0 16px}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--ln)}
.btn.sm{height:34px;font-size:13px;border-radius:10px;padding:0 12px}
.btn.red{background:var(--card);color:var(--exp);border:1px solid var(--ln)}
.btn.danger{background:var(--exp);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--ln);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.seg{display:flex;gap:3px;padding:4px;background:var(--seg);border-radius:14px;margin-bottom:14px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;padding:0}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--ln);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:18px;flex:none}
.badge{position:absolute;top:-2px;right:-2px;background:var(--exp);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
input,select{height:44px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;font-size:15px;font-weight:600;background:var(--card);width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--a)}
.form{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sheetWrap{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:10}
#sheet{background:var(--bg);width:100%;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 16px 28px}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
#mbox{background:var(--card);border-radius:20px;padding:22px 20px 18px;width:100%;max-width:340px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
#mbox .mt{font-size:18px;font-weight:800;margin-bottom:8px}
#mbox .mm{font-size:14px;line-height:1.5;color:var(--mut)}
.mbtns{display:flex;gap:8px;margin-top:18px}.mbtns .btn{flex:1}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.amt{font-size:42px;font-weight:800;text-align:center;letter-spacing:-.03em;margin:8px 0 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{height:66px;border:1px solid var(--ln);border-radius:14px;background:var(--card);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px}
.cat.on{border:2px solid var(--a);background:var(--soft)}
.dot{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.dot.emo{font-size:19px}
.dot.sm{width:26px;height:26px;border-radius:8px;font-size:11px}.dot.sm.emo{font-size:16px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{height:46px;border:0;border-radius:12px;background:var(--card);font-size:20px;font-weight:600;cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--seg);color:var(--mut);white-space:nowrap;margin-top:2px}
.pill.warn{background:#FDF0E1;color:#9A4A0B}.pill.bad{background:#FBE4DC;color:#9C2F0C}.pill.ok{background:#E3F2EA;color:#0B7A4B}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:10px 12px;text-align:right;border-top:1px solid var(--ln)}td:first-child,th:first-child{text-align:left}
th{font-size:11px;color:var(--mut);text-transform:uppercase;border-top:0}
tbody tr{cursor:pointer}tr.sel{background:var(--soft);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:10px 14px;font-size:14px;gap:12px}.kv+.kv{border-top:1px solid var(--ln)}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#10201E;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
#toast.show{opacity:1}
/* iPhone safe areas (notch + home bar) */
#view{padding-top:calc(20px + env(safe-area-inset-top))}
nav{height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
#view{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
#view.tb{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#view.ob{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#tripbar{bottom:calc(76px + env(safe-area-inset-bottom))}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))}
#sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom));max-height:calc(94% - env(safe-area-inset-top))}
html,body{overscroll-behavior:none}
input,select,textarea{font-size:16px}
.ne{font-size:21px;line-height:22px;filter:grayscale(.7);opacity:.7}.nb.on .ne{filter:none;opacity:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:0;border-radius:16px;background:color-mix(in srgb,var(--tc) 13%,var(--card));color:var(--ink);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;cursor:pointer;text-align:center}
.tile span{width:42px;height:42px;border-radius:13px;background:var(--tc);display:flex;align-items:center;justify-content:center;font-size:21px}
.chipnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 12px;scrollbar-width:none}
.chipnav .chip{flex:none}
.ck{width:24px;height:24px;border-radius:12px;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800;color:#fff}
.ck.on{background:var(--a);border-color:var(--a)}
.row.picked{background:var(--soft)}
#selbar{position:absolute;left:12px;right:12px;bottom:86px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:6}
.empty{text-align:center;color:var(--mut);padding:24px;font-size:13px}
.link{background:none;border:0;color:var(--a);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.thumb{width:100%;max-height:140px;object-fit:cover;border-radius:12px;margin-top:10px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border:2px solid var(--ln);border-radius:16px;padding:12px;background:var(--card);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.th.on{border-color:var(--a);box-shadow:0 0 0 3px var(--soft)}
.sw{display:flex;gap:4px}.sw i{width:20px;height:20px;border-radius:6px;display:block;border:1px solid rgba(0,0,0,.08)}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.steps i.on{background:var(--a)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
<main id="view"></main>
<nav></nav>
<div id="selbar" hidden></div>
<div id="tripbar" hidden data-act="tset"></div>
<div id="sheetWrap" hidden><div id="sheet"></div></div>
<div id="modal" hidden><div id="mbox" role="alertdialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
</div>

<script>
const APP_VERSION = '0.10.0';
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = x => String(x).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = new Date(), T = iso(TODAY), YM = T.slice(0, 7);
const dAgo = k => { const d = new Date(TODAY); d.setDate(d.getDate() - k); return iso(d); };
const r2 = x => Math.round(x * 100) / 100;
const sum = (a, f) => a.reduce((t, x) => t + (typeof f === 'function' ? f(x) : x[f]), 0);
const money = x => 'RM ' + Math.abs(x).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = x => (x < 0 ? '− ' : '') + money(x);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s[0].toUpperCase() + s.slice(1);
const ordinal = x => { const s = ['th', 'st', 'nd', 'rd'], m = x % 100; return x + (s[(m - 20) % 10] || s[m] || s[0]); };
const v = id => (document.getElementById(id) || {}).value || '';
const n = id => parseFloat(String(v(id)).replace(/,/g, '')) || 0;

// ---------- look ----------
const BASE = { card: '#FFFFFF', ink: '#10201E', mut: '#5B6B68', ln: '#E3E8E6', inc: '#0B7A4B', exp: '#B4401A' };
const THEMES = {
  teal: { name: 'Calm teal', a: '#0F5F59', bg: '#F3F6F5', soft: '#E6F0EF', seg: '#E6ECEA' },
  mango: { name: 'Mango', a: '#C2410C', bg: '#FFF7ED', soft: '#FFEDD5', seg: '#FBE6D0' },
  berry: { name: 'Berry', a: '#7C3AED', bg: '#F6F3FF', soft: '#EDE9FE', seg: '#E8E2FA' },
  ocean: { name: 'Ocean', a: '#1D4ED8', bg: '#F0F6FF', soft: '#DBEAFE', seg: '#DCE6F7' },
  candy: { name: 'Candy', a: '#BE185D', bg: '#FDF2F8', soft: '#FCE7F3', seg: '#F6DDEA' },
  night: { name: 'Night', a: '#0F766E', bg: '#0E1513', card: '#18211F', ink: '#E6EEEC', mut: '#A3B3AF', ln: '#2A3633', soft: '#13332F', seg: '#202B29', inc: '#4ADE9A', exp: '#FF8F6B', dark: true }
};
const TRIP_LIGHT = { a: '#0369A1', bg: '#E6F3FC', soft: '#D2E9F8', seg: '#D5E6F3' };
const TRIP_DARK = { a: '#0369A1', bg: '#091520', card: '#11202C', ln: '#21374A', soft: '#11314A', seg: '#1A2C3A' };
function applyTheme(k, tripMode) {
  const base = THEMES[k] || THEMES.teal;
  const t = { ...BASE, ...base, ...(tripMode ? (base.dark ? TRIP_DARK : TRIP_LIGHT) : {}) }, st = document.documentElement.style;
  ['a', 'bg', 'card', 'ink', 'mut', 'ln', 'soft', 'seg', 'inc', 'exp'].forEach(p => st.setProperty('--' + p, t[p]));
  document.body.style.background = t.dark ? '#050808' : '#DDE4E2';
}
const CATS = {
  expense: [['Food', '#E8590C', '🍜'], ['Transport', '#2F5AA8', '🚗'], ['Groceries', '#0B7A4B', '🛒'], ['Bills', '#B7791F', '💡'], ['Shopping', '#8E3BA8', '🛍️'], ['Petrol', '#4B5563', '⛽'], ['Loans', '#0F5F59', '🏦'], ['Instalments', '#2F7A8A', '💳'], ['Health', '#B42346', '💊'], ['Fun', '#C2185B', '🎬'], ['Family', '#6B4FA0', '👨‍👩‍👧'], ['Other', '#5B6B68', '✨']],
  income: [['Salary', '#0B7A4B', '💼'], ['Side income', '#2F7A8A', '🌱'], ['Transfer from person', '#2F5AA8', '🤝'], ['Refund', '#B7791F', '🔁'], ['Other', '#5B6B68', '💰']]
};
const catInfo = (type, c) => (CATS[type] || []).find(x => x[0] === c) || [c, '#5B6B68', '✨'];
const KINDS = { cash: ['Cash', '💵', '#0B7A4B'], bank: ['Bank', '🏦', '#1D4ED8'], ewallet: ['E-wallet', '📱', '#7C3AED'], card: ['Credit card', '💳', '#BE185D'], debit: ['Debit card', '🏧', '#2F7A8A'], other: ['Other', '👛', '#B7791F'] };
const ACC = [['Cash', 'cash'], ['Maybank', 'bank'], ['CIMB', 'bank'], ['Public Bank', 'bank'], ['RHB', 'bank'], ['Hong Leong', 'bank'], ['AmBank', 'bank'], ['Bank Islam', 'bank'], ['BSN', 'bank'], ['GXBank', 'bank'], ['AEON Bank', 'bank'], ["Touch 'n Go eWallet", 'ewallet'], ['GrabPay', 'ewallet'], ['Boost', 'ewallet'], ['ShopeePay', 'ewallet'], ['BigPay', 'ewallet']];
const emo = () => !!(S && S.emoji);
const dot = (col, e, letter, sm) => emo()
  ? `<span class="dot emo ${sm ? 'sm' : ''}" style="background:${col}26">${e}</span>`
  : `<span class="dot ${sm ? 'sm' : ''}" style="background:${col}">${esc(String(letter)[0])}</span>`;
const yay = s => s + (emo() ? ' 🎉' : '');
const E = e => emo() ? e + ' ' : '';
const fmtD = d => new Date(d + 'T00:00').toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });

// ---------- trips ----------
const CURS = { MYR: 'RM', THB: '฿', JPY: '¥', KRW: '₩', SGD: 'S$', IDR: 'Rp', VND: '₫', TWD: 'NT$', CNY: 'CN¥', HKD: 'HK$', AUD: 'A$', GBP: '£', EUR: '€', USD: 'US$' };
const NODEC = ['JPY', 'KRW', 'IDR', 'VND'];
const fc = (x, c) => { const z = NODEC.includes(c) ? 0 : 2; return (x < 0 ? '− ' : '') + (CURS[c] || c) + ' ' + Math.abs(x).toLocaleString('en-MY', { minimumFractionDigits: z, maximumFractionDigits: z }); };
const TCATS = [['Food', '🍜', '#E8590C'], ['Transport', '🚕', '#2F5AA8'], ['Hotel', '🏨', '#7C3AED'], ['Tickets', '🎟️', '#BE185D'], ['Flights', '✈️', '#1D4ED8'], ['Activities', '🎢', '#C2185B'], ['Shopping', '🛍️', '#8E3BA8'], ['Insurance', '🛡️', '#0F5F59'], ['SIM & data', '📶', '#2F7A8A'], ['Souvenirs', '🎁', '#B7791F'], ['Others', '📝', '#5B6B68']];
const tcat = c => TCATS.find(x => x[0] === c) || TCATS[TCATS.length - 1];
const TEMO = ['✈️', '🏝️', '🗻', '🏙️', '🎢', '🏕️', '🍣', '🚗'];
const trip = () => S.trips.find(t => t.id === curTrip);
const mname = (t, id) => (t.members.find(m => m.id === id) || { name: '?' }).name;
const tripDays = t => Math.max(1, Math.round((new Date(t.end) - new Date(t.start)) / 864e5) + 1);
const rmOf = (t, x) => t.cur === 'MYR' ? x : x * (t.rate || 0);
const hasRate = t => t.cur !== 'MYR' && t.rate > 0;
function tripCalc(t, rnd, groupOnly) {
  const inR = x => rnd == null || (x.round || 0) === rnd;
  const solo = e => e.split && e.split.length === 1 && e.paidBy === e.split[0];
  const F = t.funds.filter(inR), X = t.exps.filter(e => inR(e) && !(groupOnly && solo(e)));
  const net = {}, share = {}, put = {}, self = {};
  t.members.forEach(m => { net[m.id] = 0; share[m.id] = 0; put[m.id] = 0; self[m.id] = 0; });
  F.forEach(f => { if (f.member in net) { net[f.member] += f.amount; put[f.member] += f.amount; } });
  X.forEach(e => {
    const who = (e.split && e.split.length ? e.split : t.members.map(m => m.id)).filter(id => id in net);
    if (!who.length) return;
    const each = e.amount / who.length;
    who.forEach(id => { net[id] -= each; share[id] += each; });
    if (e.paidBy !== 'pool' && e.paidBy in net) { net[e.paidBy] += e.amount; self[e.paidBy] += e.amount; }
  });
  [net, share, put, self].forEach(o => Object.keys(o).forEach(k => { o[k] = r2(o[k]); }));

function plan() {
  if (!planTab) return planHome();
  if (planTab === 'trips' && trip()) return tripView();
  let body = '';
  if (planTab === 'trips') body = tripsList();
  else if (planTab === 'bills') {
    const bs = commits().filter(c => c.k === 'bills'), paid = bs.filter(c => c.paid);
    body = `<div class="card pad"><div class="sp"><span class="mut" style="font-weight:600">Bills this month</span><b>${paid.length} of ${bs.length} paid</b></div>

  } else if (planTab === 'loans') {
    body = `<div class="hero" style="margin-bottom:12px"><div class="sp"><div><div style="font-size:13px;opacity:.85">Total loans left</div><div class="num" style="font-size:28px;font-weight:800">${money(sum(S.loans, 'balance'))}</div></div><div style="text-align:right"><div style="font-size:12px;opacity:.85">Monthly</div><b class="num">${money(sum(S.loans.filter(l => l.balance > 0), 'monthly'))}</b></div></div></div>` +
      (S.loans.map(l => {
        const p = l.principal ? Math.round((1 - l.balance / l.principal) * 100) : 0, paid = (l.paid || []).includes(YM);
        return `<div class="card pad"><div class="sp"><button class="list-btn t" style="padding:0;width:auto" data-act="item" data-k="loans" data-id="${l.id}">${emo() ? '🏦 ' : ''}${esc(l.name)}</button><span class="t num">${money(l.monthly)}/mo</span></div>

        <div class="sp" style="margin-top:10px">${pill({ paid, day: l.day })}${paid || l.balance <= 0 ? '' : `<button class="btn sm" data-act="pay" data-k="loans" data-id="${l.id}">Log payment</button>`}</div></div>`;
      }).join('') || '<div class="empty">No loans yet. Tap + New.</div>');
  } else if (planTab === 'inst') {
    const left = sum(S.inst, i => i.total - r2(i.total / i.months) * i.paidCount);
    body = `<div class="hero" style="margin-bottom:12px"><div class="sp"><div><div style="font-size:13px;opacity:.85">Instalments remaining</div><div class="num" style="font-size:28px;font-weight:800">${money(Math.max(0, left))}</div></div><div style="text-align:right"><div style="font-size:12px;opacity:.85">Monthly</div><b class="num">${money(sum(S.inst.filter(i => i.paidCount < i.months), i => i.total / i.months))}</b></div></div></div>` +
      (S.inst.map(i => {
        const mo = r2(i.total / i.months), rem = Math.max(0, r2(i.total - mo * i.paidCount)), paid = (i.paid || []).includes(YM), done = i.paidCount >= i.months;
        return `<div class="card pad"><div class="sp"><button class="list-btn t" style="padding:0;width:auto" data-act="item" data-k="inst" data-id="${i.id}">${emo() ? '💳 ' : ''}${esc(i.name)}</button><span class="t num">${money(mo)}/mo</span></div>

        <div class="sp mut num"><span><b style="color:var(--ink)">${i.paidCount} of ${i.months} paid</b> · ${i.months - i.paidCount} months left</span><span>Left <b style="color:var(--ink)">${money(rem)}</b></span></div>
        <div class="sp" style="margin-top:10px">${done ? '<span class="pill ok">Fully paid</span>' : pill({ paid, day: i.day })}${paid || done ? '' : `<button class="btn sm" data-act="pay" data-k="inst" data-id="${i.id}">Pay this month</button>`}</div></div>`;
      }).join('') || '<div class="empty">No instalments yet. Tap + New.</div>') +
      `<button class="btn g" style="width:100%" data-act="tool" data-t="instc">Open instalment calculator</button>`;
  } else if (planTab === 'budgets') {

  }
  const cur = PT.find(x => x[0] === planTab);
  return `<div class="top"><button class="ib" data-act="ptab" data-p="" aria-label="Back to Plan">‹</button><div class="h1" style="flex:1">${E(cur[1])}${cur[2]}</div>${helpBtn('plan-' + planTab)}<button class="btn sm" data-act="${planTab === 'trips' ? 'tnew' : 'new'}">${E('➕')}New</button></div>${body}`;
}

// ---------- receipt reading (OCR) ----------
let tessP = null;
function loadTess() {
  if (window.Tesseract) return Promise.resolve();
  if (!tessP) tessP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload = res; s.onerror = () => { tessP = null; rej(); }; document.head.appendChild(s); });
  return tessP;
}
function parseReceipt(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const nums = l => (l.replace(/(?<=\d)[Oo]|[Oo](?=\d)/g, '0').match(/\d{1,3}(?:[,\s]\d{3})*[.,]\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g) || []).map(x => parseFloat(x.replace(/[,\s](?=\d{3}\b)/g, '').replace(',', '.')));
  const bad = /sub\s*-?\s*total|discount|diskaun|tax|sst|gst|service|rounding|change|cash|tunai|baki|tendered|paid/i;
  const keys = [/grand\s*total|jumlah\s*besar|amount\s*due|total\s*due|net+\s*total|total\s*amount|total\s*payable|jumlah\s*bayaran/i, /\btotal\b|\bjumlah\b/i];
  let total = null, guessed = false;
  outer: for (const k of keys) {
    for (let i = lines.length - 1; i >= 0; i--) {
      if (k.test(lines[i]) && !bad.test(lines[i])) {
        const a = nums(lines[i]), b = nums(lines[i + 1] || '');
        if (a.length) { total = a[a.length - 1]; break outer; }
        if (b.length) { total = b[0]; break outer; }
      }
    }
  }
  if (total == null) { const all = lines.flatMap(nums).filter(x => x < 100000); if (all.length) { total = Math.max(...all); guessed = true; } }
  const shop = (lines.find(l => /[A-Za-z]{3,}/.test(l)) || '').replace(/[^\w\s&'.-]/g, '').trim().slice(0, 40);
  let date = null; const dm = text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if (dm) { const y = dm[3].length === 2 ? '20' + dm[3] : dm[3]; if (+dm[2] >= 1 && +dm[2] <= 12 && +dm[1] >= 1 && +dm[1] <= 31) date = `${y}-${pad(+dm[2])}-${pad(+dm[1])}`; }
  return { total, guessed, shop, date };
}
function readReceipt(file) {
  A.ocrMsg = '🔎 Reading the receipt…'; drawAdd();
  loadTess().then(() => window.Tesseract.recognize(file, 'eng')).then(({ data }) => {
    if (!A || $('#sheetWrap').hidden) return;
    syncA();
    const p = parseReceipt(data.text || '');
    if (p.total) {
      A.expr = String(p.total);
      A.ocrMsg = `✅ Found total <b style="color:var(--ink)">${money(p.total)}</b>${p.guessed ? ' (best guess)' : ''}. Check it against the receipt. Wrong? Tap C and type the right amount.`;
      if (p.shop && !A.note) A.note = p.shop;
      if (p.date && p.date <= T) A.date = p.date;
    } else A.ocrMsg = '⚠️ Couldn’t read the total. Please type it in.';
    if (A.step === 1) drawAdd();
  }).catch(() => { if (!A || $('#sheetWrap').hidden) return; syncA(); A.ocrMsg = '⚠️ Couldn’t read this receipt here. Please type the total. (The real app reads it on your phone.)'; if (A.step === 1) drawAdd(); });
}

function pay(k, id, amtOverride) {
  const it = S[k].find(x => x.id === id); if (!it) return;
  if (k === 'bills' && it.varies && amtOverride == null) {
    openSheet(`${sheetHead('Pay ' + esc(it.name))}<div class="form"><label class="f">This month's amount (RM)<input id="pv" inputmode="decimal" value="${it.amount}"></label><label class="f">Paid from<select id="pw">${wopts(defWallet())}</select></label><button class="btn" data-act="payv" data-id="${id}">Mark paid</button></div>`);
    return;
  }
  it.paid = it.paid || []; if (it.paid.includes(YM)) return;
  let amt, cat;
  if (k === 'bills') { amt = amtOverride ?? it.amount; cat = 'Bills'; }
  else if (k === 'loans') { amt = Math.min(it.monthly, it.balance); it.balance = r2(it.balance - amt); cat = 'Loans'; }
  else { amt = r2(it.total / it.months); it.paidCount++; cat = 'Instalments'; }
  it.paid.push(YM);
  S.records.push({ id: uid(), type: 'expense', amount: r2(amt), cat, wallet: v('pw') || defWallet(), date: T, note: it.name });
  save(); closeSheet(); toast(yay('Paid · logged ' + money(amt))); render();
}

async function fetchRate(cur) {
  const srcs = [[`https://open.er-api.com/v6/latest/${cur}`, j => j.rates && j.rates.MYR, j => (j.time_last_update_utc || '').slice(5, 16), 'ExchangeRate-API'],
    [`https://api.frankfurter.app/latest?from=${cur}&to=MYR`, j => j.rates && j.rates.MYR, j => j.date, 'Frankfurter (ECB)']];
  for (const [u, get, dt, name] of srcs) {
    try { const r = await fetch(u); if (!r.ok) continue; const j = await r.json(); const x = get(j); if (x) return { rate: x, date: dt(j), name }; } catch (e) {}
  }
  return null;
}
async function getRate(cur, target) {
  const box = document.getElementById(target); if (!box || cur === 'MYR') return;
  box.value = ''; box.placeholder = 'Getting today’s rate…';
  const r = await fetchRate(cur);
  if (!document.getElementById(target)) return;
  if (r) {
    const val = r.rate < 0.01 ? r.rate.toFixed(6) : r.rate < 1 ? r.rate.toFixed(4) : r.rate.toFixed(3);
    box.value = String(parseFloat(val));
    modal('💱 Please check your rate', `We filled in today's market rate: <b style="color:var(--ink)">1 ${cur} = RM ${parseFloat(val)}</b>${r.date ? ' (' + esc(r.date) + ')' : ''}.<br><br>Your bank, card or money changer usually gives a slightly different rate. Change it to the rate you actually got so your RM amounts are right.`, [{ label: 'OK, got it', act: 'mclose' }]);
  } else {
    box.placeholder = 'e.g. 0.031';
    modal('💱 Please enter your currency rate', `We couldn't get today's rate (maybe you're offline). Check your bank or money changer app and type in how many RM you pay for 1 ${cur}.`, [{ label: 'OK', act: 'mclose' }]);
  }
}

    const conv = x => TFU.inRM ? r2(x / t.rate) : x;
    let parts;

  tsetSave: () => { const t = trip(); const nm = v('sn').trim(); if (!nm) return toast('Name can’t be empty'); t.name = nm; t.start = v('ss') || t.start; t.end = v('se') || t.end; if (t.end < t.start) t.end = t.start; if ($('#sr')) t.rate = n('sr'); t.budget = n('sb'); save(); closeSheet(); toast('Trip updated'); render(); },
  tdeltrip: () => modal(`Delete ${esc(trip().name)}?`, 'All its spending, pool money and settlements will be gone. This can’t be undone.', [{ label: 'Keep', act: 'mclose', cls: 'g' }, { label: 'Delete trip', act: 'tdeltripOk', cls: 'danger' }]),
  tdeltripOk: () => { S.trips = S.trips.filter(t => t.id !== curTrip); curTrip = null; save(); closeModal(); closeSheet(); toast('Trip deleted'); render(); },
  // look
  themes: () => openSheet(`${sheetHead('Theme')}${themeCards(S.theme)}`),
  emoji: (d, b) => { S.emoji = b.checked; save(); render(); },
  // tools
  tool: d => openTool(d.t),
  isel: d => { instSel = Number(d.m); recalc(); },
  itrack: () => {
    const P = n('ip') - n('idp'), R = n('ir'), m = instSel, total = r2(P * (1 + R / 100 * m / 12));
    S.inst.push({ id: uid(), name: v('iname') || 'New item', total, months: m, paidCount: 0, plan: R ? R + '% flat' : '0% plan', day: TODAY.getDate(), remind: [3], paid: [] });
    save(); closeSheet(); tab = 'plan'; planTab = 'inst'; toast(yay('Added to instalments')); render();
  },
  csv: () => {
    const rows = [['Date', 'Type', 'Category', 'Account', 'To account', 'Amount (RM)', 'Note']].concat([...S.records].sort((a, b) => a.date.localeCompare(b.date)).map(r => [r.date, r.type, r.cat, wn(r.wallet), r.to ? wn(r.to) : '', r.amount, r.note]));
    const csv = rows.map(r => r.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    openSheet(`${sheetHead('Export records (CSV)')}<div class="mut" style="margin-bottom:8px">Copy this and paste it into Excel or Google Sheets.</div><textarea id="csvbox" readonly style="width:100%;height:280px;border-radius:12px;border:1px solid var(--ln);padding:12px;font:12px monospace;background:var(--card);color:var(--ink)">${esc(csv)}</textarea><button class="btn" style="width:100%;margin-top:10px" data-act="csvcopy">📋 Copy</button>`);
  },
  csvcopy: () => { const box = $('#csvbox'); (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(() => toast('Copied'), () => { box.select(); toast('Select all and copy'); }); },
  reset: () => modal('⚠️ Start over?', 'This deletes <b style="color:var(--ink)">everything</b> on this phone: records, accounts, bills, loans and trips. It can’t be undone.<br><br>Type <b style="color:var(--ink)">DELETE</b> to confirm.<input id="delc" placeholder="Type DELETE" autocomplete="off">', [{ label: 'Cancel', act: 'mclose', cls: 'g' }, { label: 'Start over', act: 'resetOk', cls: 'danger' }]),
  resetOk: () => { if (v('delc').trim().toUpperCase() !== 'DELETE') return toast('Type DELETE to confirm'); try { localStorage.removeItem(K); } catch (e) {} S = null; OB = { step: 0, mode: null, theme: 'teal', emoji: true, picks: [{ name: 'Cash', kind: 'cash' }] }; closeModal(); closeSheet(); render(); }
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheetWrap') return closeSheet();
  if (e.target.id === 'modal') return closeModal();
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.type === 'checkbox') return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset, b);
});
document.addEventListener('change', e => {
  const b = e.target;
  if (b.type === 'checkbox' && b.dataset.act && ACT[b.dataset.act]) return ACT[b.dataset.act](b.dataset, b);
  if (b.id === 'tc') { const lbl = $('#trl'); if (b.value === 'MYR') { $('#tr').value = ''; if (lbl) lbl.style.opacity = .4; return; } if (lbl) lbl.style.opacity = 1; return getRate(b.value, 'tr'); }
  if (b.id === 'aph' && b.files[0]) {
    syncA(); const f = b.files[0]; A.photo = URL.createObjectURL(f); A.step = 1; readReceipt(f);
  }
});
document.addEventListener('input', e => {
  if (e.target.hasAttribute('data-calc')) recalc();
  if (e.target.dataset && e.target.dataset.fp && TFU) { TFU.parts[e.target.dataset.fp] = e.target.value; TFU.edited = true; checkParts(); }
  if (e.target.id === 'fa2' && TFU && TFU.mode === 'total' && $('#fsplit')) { syncTFU(); TFU.edited = false; const t = trip(), ids = Object.keys(TFU.parts).length ? (TFU.start ? TFU.people : poolPeople(t)) : (TFU.start ? TFU.people : poolPeople(t)); $('#fsplit').innerHTML = splitRows(t, ids); checkParts(); $('#ftot').textContent = ''; return; }
  if (e.target.id === 'fa2' && TFU) { const t = trip(), k = TFU.start ? TFU.people.length : TFU.who === 'all' ? poolPeople(t).length : 1, a = parseFloat(e.target.value) || 0; $('#ftot').textContent = a && k > 1 ? 'Total into pool: ' + (v('fc2') === 'R' ? money(a * k) : fc(a * k, t.cur)) : ''; }
});
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('🔄 New version ready, close and reopen the app'); }); });
  }).catch(() => {});
}
</script>
</body>
</html>
